<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste - Kochbuch App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <header class="bg-green-600 text-white w-full">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <a href="../index.html" class="text-4xl font-bold hover:text-green-200">Kochbuch App</a>
                <a href="recipes.html" class="text-xl hover:text-green-200">Rezepte</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-6">Einkaufsliste</h1>
        
        <div class="bg-white rounded-lg shadow p-6">
            <ul id="shopping-items" class="space-y-2 mb-6"></ul>
            
            <form id="add-item-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" id="item-name" placeholder="Artikel" required
                       class="p-2 border rounded focus:ring-2 focus:ring-green-500">
                <input type="number" id="item-amount" placeholder="Menge" required
                       class="p-2 border rounded focus:ring-2 focus:ring-green-500">
                <input type="text" id="item-unit" placeholder="Einheit" required
                       class="p-2 border rounded focus:ring-2 focus:ring-green-500">
                <button type="submit" 
                        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
                    Hinzufügen
                </button>
            </form>
        </div>
    </main>

    <script type="module" src="../js/shopping.js"></script>
</body>
</html>
