<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einkaufsliste</title>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">Einkaufsliste</h1>
        
        <div class="shopping-list-container bg-white rounded-lg shadow p-4">
            <!-- Der "Alles löschen" Button wird hier eingefügt -->
            
            <ul id="shopping-items" class="mb-4">
                <!-- Einkaufslisten-Einträge werden hier eingefügt -->
            </ul>
            
            <form id="add-item-form" class="flex gap-2">
                <input type="text" id="item-name" 
                       placeholder="Artikel" required 
                       class="flex-grow p-2 border rounded">
                <input type="number" id="item-amount" 
                       placeholder="Menge" required 
                       class="w-24 p-2 border rounded">
                <input type="text" id="item-unit" 
                       placeholder="Einheit" required 
                       class="w-24 p-2 border rounded">
                <button type="submit" 
                        class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                    Hinzufügen
                </button>
            </form>
        </div>
        
        <a href="index.html" class="inline-block mt-4 text-green-600 hover:text-green-700">
            Zurück zur Startseite
        </a>
    </div>

    <script type="module" src="src/js/shopping.js"></script>
</body>
</html>
